{% comment %}
  Inline stroke icon for the editorial sidebar, keyed by the tab's Font Awesome
  class (from _tabs/*.md `icon:`) so tabs keep a single source of truth.
  Usage: {% include editorial-icon.html fa='fas fa-tags' %}
{% endcomment %}
<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% case include.fa %}
{% when 'home' %}<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
{% when 'fas fa-stream' %}<path d="M4 6h16M4 12h10M4 18h13"/>
{% when 'fas fa-tags' %}<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.25"/>
{% when 'fas fa-layer-group' %}<path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>
{% when 'fas fa-archive' %}<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>
{% when 'fas fa-info-circle' %}<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
{% else %}<circle cx="12" cy="12" r="3"/>
{% endcase %}
</svg>
