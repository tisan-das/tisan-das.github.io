  title: Report → ObjectMapper
  kind: code
  lang: java
  domain: Reporting
  level: 2
  meta:
  - Code
  - Java
  - Reporting
  q: |-
    A report serializes itself to JSON.

    ```java
    class Report {
        private final List<Row> rows;

        String toJson() throws JsonProcessingException {
            return new ObjectMapper().writeValueAsString(rows);
        }
    }
    ```
  answer: 0
  notes:
  - label: Deciding clue
    text: The ObjectMapper is a temporary created inside one method and dropped when it returns.
  - label: Why
