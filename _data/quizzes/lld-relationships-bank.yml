- n: 13
  title: Car → Engine
  kind: code
  lang: cpp
  domain: Automotive
  level: 2
  meta:
  - Code
  - C++
  - Automotive
  q: |-
    A simulation models a car's engine.

    ```cpp
    class Car {
        std::unique_ptr<Engine> engine_;
    public:
        Car() : engine_(std::make_unique<Engine>()) {}
        void start() { engine_->ignite(); }
    };
    ```
  answer: 4
  notes:
  - label: Deciding clue
    text: 'std::`unique_ptr` created in the constructor: exactly one owner, freed in Car''s destructor.'
  - label: Why
    text: '`unique_ptr` encodes exclusive ownership in the type system. The car makes its own engine, nobody else can hold an owning pointer to it, and it''s destroyed when the car is. Even if the constructor took a `unique_ptr<Engine>` by move, it would still be composition, since ownership transfers and stays exclusive.'
  - label: Tempting wrong turn
    text: Dependency is tempting because `start()` merely calls the engine. The call is incidental; the stored `unique_ptr` is what defines the relationship.
