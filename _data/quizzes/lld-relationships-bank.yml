- n: 7
  title: Server → sync.Mutex
  kind: code
  lang: go
  domain: Networking
  level: 2
  meta:
  - Code
  - Go
  - Networking
  q: |-
    A TCP server guards its connection map with a mutex.

    ```go
    type Server struct {
        mu    sync.Mutex
        conns map[string]*Conn
    }

    func (s *Server) add(id string, c *Conn) {
        s.mu.Lock()
        defer s.mu.Unlock()
        s.conns[id] = c
    }
    ```
  answer: 4
  notes:
  - label: Deciding clue
    text: mu is a value field, not a pointer, so the mutex is physically laid out inside the Server's memory.
  - label: Why
    text: 'A value field is created with the struct, destroyed with it, and can''t be shared. Copying a Server would copy the mutex, which go vet flags as a bug. That is composition in its purest form: the part is literally inside the whole.'
  - label: Tempting wrong turn
    text: 'Dependency is tempting because the mutex is "just used" for locking. But it''s stored as state: the strict test says it is still held after every method returns, so it isn''t a dependency.'
- n: 8
  title: Target group → EC2 instance
  kind: scenario
  domain: AWS
  level: 2
  meta:
  - Scenario
  - AWS
  q: An ALB target group lists the instances that receive traffic. Deleting the target group doesn't terminate any instance, and one instance can be registered in several target groups.
  answer: 3
  also:
  - i: 1
    note: Defensible if you see the target group as a routing rule that references instances rather than a collection made of them. Most designers read "group" as a whole made of members, hence aggregation.
  notes:
  - label: Deciding clue
    text: A group made of members that exist independently and can belong to several groups.
  - label: Why
    text: The target group is defined by its membership (whole–part), yet its members outlive it and are shared. Membership collections like this are the canonical aggregation.
  - label: Tempting wrong turn
    text: Composition is tempting because the target group "contains" instances. But terminating the group never terminates the instance.
- n: 9
  title: Scheduler → Clock
  kind: code
  lang: go
  domain: Job scheduling
  level: 1
  meta:
  - Code
  - Go
  - Job scheduling
  q: |-
    A scheduler decides which jobs are due.

    ```go
    type Scheduler struct {
        jobs []Job
    }

    func (s *Scheduler) Due(c Clock) []Job {
        now := c.Now()
        var due []Job
        for _, j := range s.jobs {
            if !j.NextRun.After(now) {
                due = append(due, j)
            }
        }
        return due
    }
    ```
  answer: 0
  notes:
  - label: Deciding clue
    text: Clock appears only as a parameter; the struct has no Clock field.
  - label: Why
    text: After `Due()` returns, the scheduler holds no reference to the clock. The link exists only for the duration of one call.
  - label: Tempting wrong turn
    text: Association is tempting because the scheduler clearly needs a clock to function. Needing something isn't the same as keeping it.
- n: 10
  title: Order → OrderLine
  kind: schema
  lang: sql
  domain: E-commerce
  level: 1
  meta:
  - Schema
  - SQL
  - E-commerce
  q: |-
    What relationship does this schema encode?

    ```sql
    CREATE TABLE order_lines (
      order_id  BIGINT NOT NULL
                REFERENCES orders(id) ON DELETE CASCADE,
      line_no   INT    NOT NULL,
      sku       TEXT   NOT NULL,
      qty       INT    NOT NULL,
      PRIMARY KEY (order_id, line_no)
    );
    ```
  answer: 4
  notes:
  - label: Deciding clue
    text: The parent's id is part of the child's primary key, the FK is NOT NULL, and deletes cascade.
  - label: Why
    text: A line's identity literally includes its order ("order 42, line 3"). NOT NULL rules out orphan lines, and ON DELETE CASCADE means lines die with their order. This is the textbook relational shape of composition.
  - label: Tempting wrong turn
    text: Association class is tempting because `order_lines` carries extra columns. But it hangs off one parent, not between two independent entities, so it's a part, not a link.
- n: 11
