  - HR
  q: |-
    When a department is dissolved, its employees are moved to other departments.

    ```python
    class Department:
        def __init__(self, name: str, employees: list[Employee]):
            self.name = name
            self.employees = employees

    hr  = Department("HR", [alice, bob])
    eng = Department("Platform", [carol])
    ```
  answer: 3
  also:
  - i: 1
    note: 'Accepted: membership collections sit on the blurry aggregation/association line. Aggregation is preferred because the department is defined by its members.'
  notes:
  - label: Deciding clue
    text: Employees are created outside, passed in, and survive the department.
  - label: Why
    text: 'A department is made up of its people (whole–part), but employees outlive it and can move between departments. Passed-in parts that survive the whole: aggregation.'
  - label: Tempting wrong turn
    text: Association is tempting, and the line between the two is genuinely blurry. The reason to prefer aggregation here is that the department is defined by its members, not merely acquainted with them.
