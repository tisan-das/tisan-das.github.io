# Generated from the class-relationships question bank. 100 questions;
# `answer` and `also[].i` index into `choices`, and each choice's `path`
# walks `steps`. Used by Part 2 of the Low-Level Design series.
id: relationships
mode: deck
storage: lld-relationships-v1
answer_label: What is the relationship?
filters:
- field: kind
  label: Question type
  values:
  - - code
    - Code
  - - scenario
    - Scenario
  - - schema
    - Schema
  - - notation
    - Notation
  - - error
    - Spot the error
  - - context
    - Context flip
  - - refactor
    - Refactor
- field: level
  label: Level
  values:
  - - 1
    - Warm-up
  - - 2
    - Core
  - - 3
    - Tricky
steps:
- id: s1
  short: Kind of, or implements
  q: Is A a kind of B, or does A implement B's contract?
  opts:
  - - 'no'
    - 'No'
  - - extends
    - Yes, extends a class
  - - implements
    - Yes, implements an interface
- id: s2
  short: Link stored
  q: Is the link stored, so it still exists after the method returns?
  opts:
  - - 'yes'
    - 'Yes'
  - - 'no'
    - 'No'
- id: s3
  short: Link has data
  q: Does the link itself carry data (quantity, status, dates, role)?
  opts:
  - - 'yes'
    - 'Yes'
  - - 'no'
    - 'No'
- id: s4
  short: Whole–part
  q: 'Is it whole–part: is A made of B?'
  opts:
  - - 'yes'
    - 'Yes'
  - - 'no'
    - 'No'
- id: s5
  short: Outlive or shared
  q: Can the part outlive the whole, or be shared by another whole?
  opts:
  - - 'yes'
    - 'Yes'
  - - 'no'
    - 'No'
choices:
- key: dependency
  label: Dependency
  hint: uses it, keeps nothing
  path:
  - - s1
    - 'no'
  - - s2
    - 'no'
- key: association
  label: Association
  hint: stored link between peers
  path:
  - - s1
    - 'no'
  - - s2
    - 'yes'
  - - s3
    - 'no'
  - - s4
    - 'no'
- key: association_class
  label: Association class
  hint: the link has its own data
  path:
  - - s1
    - 'no'
  - - s2
    - 'yes'
  - - s3
    - 'yes'
- key: aggregation
  label: Aggregation
  hint: part survives or is shared
  path:
  - - s1
    - 'no'
  - - s2
    - 'yes'
  - - s3
    - 'no'
  - - s4
    - 'yes'
  - - s5
    - 'yes'
- key: composition
  label: Composition
  hint: exclusive, dies with the whole
  path:
  - - s1
    - 'no'
  - - s2
    - 'yes'
  - - s3
    - 'no'
  - - s4
    - 'yes'
  - - s5
    - 'no'
- key: inheritance
  label: Inheritance
  hint: is a kind of
  path:
  - - s1
