questions:
- n: 1
  title: Chessboard → Square
  kind: code
  lang: python
  domain: Chess
  level: 1
  meta:
  - Code
  - Python
  - Chess
  q: |-
    A chess engine models its board like this.

    ```python
    class Chessboard:
        def __init__(self):
            self._squares = [[Square(r, c) for c in range(8)]
                             for r in range(8)]

        def square_at(self, r, c) -> "Square":
            return self._squares[r][c]
    ```
  answer: 4
  notes:
  - label: Deciding clue
    text: The board builds its own squares in `__init__`, keeps them private, and a square like "e4" means nothing without a board.
  - label: Why
    text: Nothing outside the board ever creates a Square, the board never accepts squares from a caller, and the squares go when the board goes. `square_at()` lends a square out for reading, which doesn't transfer ownership.
  - label: Tempting wrong turn
    text: Aggregation is tempting because `square_at()` exposes the squares. Exposing a part for reading isn't the same as letting it live independently or be shared by another board.
- n: 2
  title: Playlist → Song
  kind: scenario
  domain: Music streaming
  level: 1
  meta:
  - Scenario
  - Music streaming
  q: Songs live in the catalog. A playlist is an ordered collection of songs; a song can appear in thousands of playlists, and deleting a playlist never deletes a song.
  answer: 3
  notes:
  - label: Deciding clue
    text: A collection whose members exist independently and are shared.
  - label: Why
    text: A playlist is meaningfully "made of" songs (whole–part), but the songs outlive it and are shared across playlists. Classic aggregation.
  - label: Tempting wrong turn
    text: Composition is tempting because a playlist is nothing but its songs. The test isn't how much of the whole the parts make up, it's whether the parts survive.
- n: 3
  title: Employee → Employee (manager)
  kind: code
  lang: python
  domain: HR
  level: 1
  meta:
  - Code
  - Python
  - HR
  q: |-
    An org chart stores each employee's manager.

    ```python
    class Employee:
        def __init__(self, name: str, manager: "Employee | None"):
            self.name = name
            self.manager = manager
    ```
  answer: 1
  notes:
  - label: Deciding clue
    text: A stored reference to an independent peer; neither is part of the other.
  - label: Why
    text: Same class on both ends makes it a reflexive (self) association. The link is held in a field, so it isn't a dependency. A manager isn't made of their reports, and firing a manager doesn't delete anyone, so it isn't whole–part.
  - label: Tempting wrong turn
    text: Aggregation is tempting because a manager "has" a team. In English "has" is cheap; ask whether the team is structurally a part of the manager object. It isn't.
- n: 4
  title: Document → Comment
  kind: scenario
  domain: Google Docs
  level: 1
  meta:
  - Scenario
  - Google Docs
  q: Each comment is anchored to a range of text in one document. Deleting the document deletes all of its comments, and there's no way to move a comment to a different document.
  answer: 4
  notes:
  - label: Deciding clue
    text: Comments die with the document and can't move to another one.
  - label: Why
    text: It's whole–part (a document's comment thread is part of the document), the part can't outlive the whole, and it can't be shared. Both lifecycle questions point to composition.
  - label: Tempting wrong turn
    text: Association is tempting because comments have their own authors and timestamps. Having attributes doesn't make something independent; its lifetime does.
- n: 5
  title: FantasyTeam → Player
  kind: code
  lang: python
  domain: Fantasy sports
  level: 2
  meta:
  - Code
  - Python
  - Fantasy sports
  q: |-
    In a fantasy league, the same real-world player can be drafted onto many different users' teams.

    ```python
    class FantasyTeam:
        def __init__(self, owner: User):
            self.owner = owner
            self.roster: list[Player] = []

        def draft(self, player: Player):
            self.roster.append(player)  # from the league's player pool
    ```
  answer: 3
  also:
  - i: 1
    note: The aggregation/association line is blurry for membership collections. Aggregation is preferred because a fantasy team is defined by its roster.
  notes:
  - label: Deciding clue
    text: A roster is a whole made of players, but each Player comes from a shared pool and appears on many teams.
  - label: Why
    text: 'Whole–part: a team is its roster. The part is created elsewhere (the league pool), passed in, survives the team being deleted, and is shared across teams. That''s aggregation.'
  - label: Tempting wrong turn
    text: Composition is tempting because the team "has" its roster. But deleting a fantasy team obviously doesn't delete the real player.
