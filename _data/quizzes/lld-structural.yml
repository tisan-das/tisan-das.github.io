# Quiz for the Low-Level Design series, generated by quizzes.py.
# `answer` is the 0-based index of the right option.
id: structural
storage: lld-structural-v1
questions:
- q: Your code calls `Notify(ctx, alert)`; the vendor SDK only offers `PostMessageContext(ctx, channel, opts...)`.
  options:
  - Facade
  - Adapter
  - Bridge
  - Proxy
  answer: 1
  explain: One object behind it, and a different shape on each side. The adapter translates between your interface and the SDK's, and nothing upstream learns about channels or message options.
- q: Add request logging and panic recovery to every HTTP handler without editing any of them.
  options:
  - Decorator
  - Proxy
  - Facade
  - Composite
  answer: 0
  explain: The same `http.Handler` interface, extra behavior around each call, and the wrappers stack. Middleware is the Decorator pattern.
- q: The catalog lives in another region. Answer repeat lookups from memory, and don't dial it at all until the first miss.
  options:
  - Decorator
  - Adapter
  - Proxy
  - Flyweight
  answer: 2
  explain: 'Same interface, and it decides whether and when calls reach the real object: a caching proxy that is also a virtual proxy. A decorator would always forward.'
- q: Five callers each create a subnet, launch nodes, write a DNS record and register the site, in that order.
  options:
  - Adapter
  - Composite
  - Bridge
  - Facade
  answer: 3
  explain: One simple front door over four subsystems, so the sequence, and what to undo when a step fails, is written once.
- q: Report CPU for one pod, a namespace or the whole cluster with the same call.
  options:
  - Composite
  - Decorator
  - Facade
  - Flyweight
  answer: 0
  explain: One item or a whole tree behind the same interface. Groups sum their children and never check whether a child is a pod or another group.
- q: Three alert kinds times three delivery channels, and both lists keep growing.
  options:
  - Adapter
  - Decorator
  - Bridge
  - Facade
  answer: 2
  explain: Two independent axes. Give each its own hierarchy and connect them with a field, so a new channel is one new type instead of three.
- q: Ten million metric samples, but only a few thousand distinct label sets.
  options:
  - Proxy
  - Composite
  - Bridge
  - Flyweight
  answer: 3
  explain: Share the identical, immutable part, the label set, and store only each sample's time and value.
- q: '`http.HandlerFunc(health)`'
  options:
  - Decorator
  - Adapter
  - Proxy
  - Facade
  answer: 1
  explain: It makes a plain function satisfy `http.Handler` without changing the function or the interface. Go's own documentation calls it an adapter.
- q: '`gzip.NewReader(file)` returns an `io.Reader` that decompresses as you read.'
  options:
  - Adapter
  - Proxy
  - Facade
  - Decorator
  answer: 3
  explain: An `io.Reader` wrapping an `io.Reader` and adding behavior. You can stack `bufio.NewReader` on top of it.
- q: '`httputil.NewSingleHostReverseProxy(backend)`'
  options:
  - Proxy
  - Adapter
  - Decorator
  - Facade
  answer: 0
  explain: 'An `http.Handler` standing in for a handler on another machine: a remote proxy.'
- q: '`Logging(Metrics(Retry(email)))` sends one message, and the first SMTP attempt fails. How many log lines and metric increments do you get?'
  options:
  - 1 log line, 1 metric increment
  - 2 log lines, 2 metric increments
  - 1 log line, 2 metric increments
  - 2 log lines, 1 metric increment
  answer: 0
  explain: 'Retry is the innermost layer, so both attempts happen inside one pass through Metrics and Logging. Put Retry outside, `Retry(Logging(Metrics(email)))`, and every attempt is logged and counted: 2 and 2.'
- q: A middleware wraps `http.ResponseWriter` to record the status code. What can quietly break behind it?
  options:
  - Request logging
  - Streaming and websockets, because the wrapper hides `http.Flusher` and `http.Hijacker`
  - Query-string parsing
  - Nothing; the wrapper has the same interface
  answer: 1
  explain: Optional interfaces disappear behind a decorator that doesn't implement them. Give the wrapper an `Unwrap() http.ResponseWriter` method so `http.ResponseController` can reach the original.
- q: Why does `CachingCatalog.Get` release its mutex before calling the real catalog?
  options:
  - Go mutexes can't be held across function calls
  - To make the cache eventually consistent
  - So callers don't all wait behind the slowest network request
  - So two callers can never fetch the same key
  answer: 2
  explain: Check the cache under the lock, call outside it, and store under the lock again. The cost is that concurrent misses for one key each call the backend; `singleflight` collapses those into one call.
- q: A hundred requests miss the cache for the same key at the same moment. What collapses them into one backend call?
  options:
  - A longer TTL
  - '`sync.Once`'
  - A bigger mutex
  - '`golang.org/x/sync/singleflight`'
  answer: 3
  explain: '`singleflight` lets the first caller for a key do the work while the others wait and share its result. A TTL doesn''t help a cold cache, and `sync.Once` would never refresh the key.'
- q: '`SiteProvisioner.Provision` has created a subnet and launched nodes, and then the DNS step fails. What does the facade in this post do?'
  options:
  - Returns the error and leaves the subnet and nodes for an operator
  - Retries the DNS step forever
  - Terminates the nodes, then deletes the subnet, and returns the error
  - Deletes the subnet first, then terminates the nodes
  answer: 2
  explain: Each finished step records an undo, and a deferred function runs them in reverse order on failure. The undo steps use `context.WithoutCancel(ctx)`, so cleanup still runs when the request itself was cancelled.
- q: On a class diagram, a decorator and a proxy look identical. What separates them?
  options:
  - A proxy always has a cache
  - 'Intent: a decorator always forwards and adds behavior; a proxy may answer, refuse or delay, and often creates its target'
  - A decorator must be a function, a proxy a struct
  - A proxy changes the interface
  answer: 1
  explain: Both implement an interface and hold one value of it. A decorator is handed its target and stacks freely, where the order of layers matters. A proxy usually stands alone in front of one object and controls access to it.
- q: One pod is added under two cost groups, and their parent sums them. What goes wrong?
  options:
  - '`CPU()` recurses forever'
  - The pod's CPU is counted twice
  - The second `Add` fails
  - Nothing; the pod reports the same CPU either way
  answer: 1
  explain: A composite assumes a tree, not a graph. A cycle, a group added to its own descendant, is the case that recurses forever; check for it in `Add`.
