# Quiz for the Low-Level Design series, generated by quizzes.py.
# `answer` is the 0-based index of the right option.
id: behavioral
storage: lld-behavioral-v1
questions:
- q: The autoscaler should switch between target tracking and a fixed schedule without any change to its own code.
  options:
  - State
  - Strategy
  - Template Method
  - Command
  answer: 1
  explain: Several ways to do one job, picked by the caller or config and swappable at runtime with `SetPolicy`.
- q: When a compute engine's status changes, metering, alerts and the audit log all need to react.
  options:
  - Observer
  - Mediator
  - Chain
  - Command
  answer: 0
  explain: One change, many independent reactions, and the source shouldn't know who's listening.
- q: '`Start()` should launch nodes when stopped, do nothing when running, and refuse while stopping.'
  options:
  - Strategy
  - Command
  - State
  - Chain
  answer: 2
  explain: The same call behaves differently in each mode, and the object moves itself between modes.
- q: Queue cluster operations, run them on a worker, and let an operator undo the last one.
  options:
  - Memento
  - Observer
  - Strategy
  - Command
  answer: 3
  explain: Requests become values that can wait, run later, and carry what they need to undo themselves.
- q: Try a client certificate, then a bearer token, then OIDC. The first that works wins.
  options:
  - Chain
  - Strategy
  - Observer
  - Template Method
  answer: 0
  explain: Handlers in a fixed order of preference, each taking the request or passing it on.
- q: '`sort.Sort(data)` runs a fixed algorithm and calls your `Len`, `Less` and `Swap`.'
  options:
  - Strategy
  - Template Method
  - Iterator
  - Visitor
  answer: 1
  explain: The skeleton is fixed in the library, and you fill in the steps it calls.
- q: '`for pod, err := range AllPods(ctx, api)` hides three pages of API calls.'
  options:
  - Visitor
  - Chain
  - Iterator
  - Command
  answer: 2
  explain: Walk a collection one item at a time without knowing how it's stored or fetched.
- q: Build, test, deploy and notify steps stop calling each other and report to one pipeline object instead.
  options:
  - Observer
  - Chain
  - Facade
  - Mediator
  answer: 3
  explain: A central coordinator holds the who-reacts-to-what logic, so each component only knows the hub.
- q: Snapshot an object before a risky change and roll back, without exposing its fields.
  options:
  - Memento
  - Command
  - Prototype
  - State
  answer: 0
  explain: An opaque saved state that the owner can restore and nobody else can read. In Go, unexported fields enforce that.
- q: Add a cost report and a lint check across Pod, Service and Ingress without touching those types.
  options:
  - Iterator
  - Strategy
  - Visitor
  - Template Method
  answer: 2
  explain: 'New operations over a fixed set of types: each operation becomes a visitor.'
- q: '`TargetTracking{Target: 60}` sees 84% CPU on 4 replicas, and the autoscaler clamps to 2–20. How many replicas does it ask for?'
  options:
  - '5'
  - '6'
  - '7'
  - '4'
  answer: 1
  explain: '`ceil(4 × 84 / 60)` is `ceil(5.6)`, which is 6, inside the clamp. `StepScaling` happens to agree (84% is above 80%, so 4 + 2), while `Scheduled` at 22:00 says 2.'
- q: One goroutine calls `SetPolicy` while another is inside `Decide`. What is that, and what fixes it?
  options:
  - A data race; guard the field with a mutex or keep it in an `atomic.Pointer`
  - Safe, because interface assignment is atomic
  - A deadlock; call `SetPolicy` only from `Decide`
  - Safe, because strategies are stateless
  answer: 0
  explain: An interface value is two words, and an unsynchronized write next to a read is a data race even if it usually works. Swapping strategies at runtime needs atomic access.
- q: Why does `StatusFeed.Publish` copy the subscriber list and call the callbacks after unlocking?
  options:
  - It's faster to iterate over a slice than a map
  - So a callback can subscribe or unsubscribe without deadlocking
  - To deliver events in subscription order
  - So callbacks run in parallel
  answer: 1
  explain: '`Subscribe` takes the same mutex. Holding it while calling subscribers means one that calls `Subscribe` waits on itself forever. Copy, unlock, then call.'
- q: Subscriber B must always run after subscriber A. What does the post recommend?
  options:
  - Register B after A; Go keeps registration order
  - Give subscribers priorities
  - 'Treat it as a workflow, not an observer: call them in order explicitly'
  - Use buffered channels
  answer: 2
  explain: The Go feed stores subscribers in a map, and map iteration order is random. Observers should be independent; a required order is a sequence, which belongs in code that calls the steps in order.
- q: On a Running instance from the State chapter, what does `fmt.Println(i.Stop(), i.Stop(), i.Start())` print?
  options:
  - '`<nil> <nil> <nil>`'
  - '`<nil> <nil> wait until stopped`'
  - '`<nil> cannot stop while starting <nil>`'
  - '`<nil> already stopping wait until stopped`'
  answer: 1
  explain: The first `Stop()` moves Running to Stopping. A second `Stop()` while Stopping is a no-op. `Start()` while Stopping is refused with "wait until stopped".
- q: A worker crashes after a command's `Execute` succeeded but before it acknowledged the message. What happens, and what protects you?
  options:
  - Nothing; the queue knows it ran
  - The command is lost; use a bigger queue
  - The queue undoes it automatically
  - It runs again; give each command an ID and make `Execute` safe to repeat
  answer: 3
  explain: At-least-once delivery means a retry after a crash. Idempotent commands turn a duplicate run into a no-op.
- q: In this post's authentication chain, an expired service account token arrives. What happens?
  options:
  - The chain tries OIDC next
  - The ServiceAccount link recognizes it as its own but invalid, so the chain stops with a 401
  - The request is let through as anonymous
  - x509 accepts it
  answer: 1
  explain: This chain treats "mine, but invalid" as final. kube-apiserver's union authenticator instead keeps trying the remaining authenticators by default and reports the combined errors. Both are reasonable; choose on purpose.
- q: Strategy and State both hold an interface and delegate to it. Which question tells them apart?
  options:
  - 'Who flips the switch: the caller, or the object itself?'
  - How many implementations are there?
  - Is the interface a single method?
  - Is it written in Go or Python?
  answer: 0
  explain: In Strategy the caller picks, and strategies never mention each other. In State each state knows which one comes next and sets it on the context.
- q: When does Visitor pay off over a type switch?
  options:
  - When new element types are added often
  - When there are only two operations
  - When the set of types is fixed and the operations keep growing
  - When the elements are in a list rather than a tree
  answer: 2
  explain: Visitor makes adding an operation cheap, one new visitor, and adding a type expensive, since every visitor must learn it. A type switch is the opposite.
