# Quiz for the Low-Level Design series, generated by quizzes.py.
# `answer` is the 0-based index of the right option.
id: creational
storage: lld-creational-v1
questions:
- q: Every HTTP handler opens its own `*sql.DB`, and Postgres starts refusing connections. Which pattern fixes it?
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 0
  explain: You need one shared pool per process. In Go, open one `*sql.DB` in `main`, or behind `sync.Once`, and pass it to the handlers. A `*sql.DB` is already a pool and is safe for concurrent use.
- q: 'Config says `storage.kind: s3` or `local`. The upload code shouldn''t care which.'
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 1
  explain: The concrete type depends on config. `NewStore(kind)` decides once, in one place, and hands back the `Store` interface, so the uploader never names a concrete type.
- q: A load balancer config has 15 optional settings, and an HTTPS listener is invalid without a certificate.
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 4
  explain: Many optional fields plus a rule that spans fields. Collect the settings step by step, and enforce the cross-field rule in `Build()`, the one place that sees everything before the object exists.
- q: The provisioner creates a VM, a bucket and a queue, and all three must come from the same cloud.
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 3
  explain: A family of products that must match. Pick one factory, AWS or Azure, and every product comes from that row, so mixing clouds can't happen.
- q: A base `Exporter` batches records. Each subclass only decides where the batches are written.
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 2
  explain: The algorithm, batching, is written once in the base type, and the one creation step, `create_sink()`, is left to subclasses. In Go the same idea is a `func` field you inject.
- q: Only one replica of your controller may act at a time, across a 3-replica Deployment.
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 5
  explain: A singleton is one per process, so three replicas means three instances. One actor across replicas needs leader election, such as client-go's `leaderelection` with a Kubernetes Lease.
- q: A `Point` struct with two required fields, `X` and `Y`.
  options:
  - Singleton
  - Factory
  - Factory Method
  - Abstract Factory
  - Builder
  - None of these
  answer: 5
  explain: 'A struct literal, `Point{X: 1, Y: 2}`, is already clear. A builder or a factory here only adds ceremony.'
- q: '`SparkSession.builder.appName("etl").getOrCreate()` uses which two patterns?'
  options:
  - Factory + Builder
  - Singleton + Abstract Factory
  - Builder + Singleton
  - Factory Method + Builder
  answer: 2
  explain: The chain collects settings, which is a builder, and `getOrCreate()` returns the active session if one already exists, which is a singleton.
- q: A Go service whose `config.Get()` is guarded by `sync.Once` runs as a Deployment with 3 replicas. How many `Config` objects exist?
  options:
  - One, shared by all replicas
  - One per goroutine that calls `Get()`
  - Three, one per replica
  - It depends on `GOMAXPROCS`
  answer: 2
  explain: A singleton is one per process, and each replica is its own process with its own memory. Gunicorn workers and `multiprocessing` pools behave the same way. Shared state across replicas belongs in a database or Redis.
- q: The function passed to `sync.Once` fails on its first run because the config file is missing. What do later calls get?
  options:
  - '`Once` runs the function again until it succeeds'
  - '`Once` panics on the next call'
  - 'Nothing new: the function never runs again, so they get the failed result'
  - They block until the file appears
  answer: 2
  explain: '`sync.Once` runs the function once, whatever happens. Use `sync.OnceValues` so every caller at least sees the error, or load the config in `main` and exit on failure.'
- q: Two goroutines call a singleton getter that does `if instance == nil { instance = load() }`. What can go wrong?
  options:
  - Both can see `nil` before either assigns, so two instances get created
  - Nothing; a pointer assignment is atomic
  - The second goroutine deadlocks
  - Go panics on concurrent reads
  answer: 0
  explain: 'Check-then-create is the most common singleton bug, and `go test -race` flags it. `sync.Once` makes the second caller wait for the first and then skip the work. In Python, the GIL doesn''t save you either: a thread can be switched out between the check and the assignment.'
- q: What is the Pythonic way to get a singleton?
  options:
  - A metaclass that caches instances
  - A module-level object, such as `settings = Config(...)` in `config.py`
  - A class with a `@staticmethod get_instance()`
  - A global inside every function that needs it
  answer: 1
  explain: Python runs a module once and caches it in `sys.modules`, so every `import` gets the same object. A class-based singleton needs a lock and a double check to be thread-safe.
- q: Go style says "accept interfaces, return structs". Why does `NewStore(kind)` return the `Store` interface anyway?
  options:
  - Interfaces are faster to return
  - The compiler requires it for `switch` statements
  - So the caller can type-assert to `*S3Store`
  - Its whole job is that the caller doesn't know which struct it gets
  answer: 3
  explain: 'A plain constructor such as `NewS3Store()` returns `*S3Store`. A factory is the exception: hiding the concrete type is the point. If callers start writing `store.(*S3Store)`, the interface isn''t doing its job.'
- q: What does `import _ "github.com/lib/pq"` do?
  options:
  - Opens a database connection at startup
  - Runs pq's `init()`, which registers the "postgres" driver with `database/sql`
  - Makes pq the default driver for every `sql.Open` call
  - Nothing; the blank identifier discards the package
  answer: 1
  explain: 'A blank import runs the package for its side effects. `database/sql` is a registry factory: drivers add themselves by name, and `sql.Open` only looks the name up. No connection opens until the first query.'
- q: Why does the `Pod` builder's `Build()` copy its slices and maps with `slices.Clone` and `maps.Clone`?
  options:
  - To make `Build()` safe to call from several goroutines
  - Otherwise reusing the builder would quietly edit Pods it already returned
  - Because Go can't return a map from a function
  - To validate the ports
  answer: 1
  explain: A copied struct still shares its slices and maps with the original. Without the clones, `b.Env(...)` after a `Build()` would change the first Pod too. Builders are still not safe to share between goroutines; make one per construction.
- q: When is a fluent builder a better fit than Go's functional options?
  options:
  - When the object has two required fields
  - When assembly happens in steps, options depend on each other, or you want to report several errors together
  - Whenever the constructor has defaults
  - Never; functional options replace builders in Go
  answer: 1
  explain: Functional options suit objects that are ready in one call, where each option stands alone. A fluent builder can collect state across steps and check everything once in `Build()`, as the Pod builder does with `errors.Join`.
- q: You add a fourth product, `NewDatabase`, to an Abstract Factory with AWS and Azure implementations. What has to change?
  options:
  - Only the callers that need a database
  - Only a new `DatabaseFactory`
  - Nothing; Abstract Factory is open for extension
  - The `CloudFactory` interface and every concrete factory
  answer: 3
  explain: 'Abstract Factory makes adding a family, such as a third cloud, cheap: one new factory. Adding a product is the expensive direction, because every family must learn to make it.'
