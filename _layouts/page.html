---
layout: shell
---
{% comment %}
  Plain pages (About, Series, 404) — replaces Chirpy's. Uses the post's
  reading column (.post), so their text looks like a post's.
{% endcomment %}
<article class="post page">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
  </header>

  {{ content }}
</article>
