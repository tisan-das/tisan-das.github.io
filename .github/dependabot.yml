# Version updates for the pinned gems (Gemfile.lock) and workflow actions
# (commit SHAs). PRs go to develop, so they build there before a release.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      gems:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
