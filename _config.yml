# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Kolkata

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Gems of Coding # the main title

tagline: Journey to understand distributed systems # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  A tech blog by Tisan Das — notes on distributed systems, databases,
  system design, algorithms, security and deep learning.

# Fill in the protocol & hostname for your site.
url: "https://gemsofcoding.com"

github:
  username: tisan-das

twitter:
  username: tisan_das

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Tisan Das
  email: tisandas2011@gmail.com
  links:
    # The first element serves as the copyright owner's link
    - https://twitter.com/tisan_das
    - https://github.com/tisan-das

# Site Verification Settings
# Google Search Console: https://search.google.com/search-console
# 1) Add property https://gemsofcoding.com
# 2) Choose HTML-tag verification → copy the content= value only
# 3) Paste below, push, then click Verify and submit sitemap.xml
webmaster_verifications:
  google: # e.g. "AbCdEf..." content value from the meta tag
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
# Google Analytics intentionally removed (saves ~470KB + ~8MB RAM per page).
# To use GoatCounter instead: sign up at goatcounter.com, set the id below
# to your site code (the subdomain, e.g. 'gemsofcoding').
analytics:
  google:
    id:
  goatcounter:
    id: # fill in your GoatCounter ID
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id: # fill in your Fathom Site ID

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
theme_mode: # [light | dark]

# The CDN endpoint for media resources.
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: /images/avatar.svg

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image: /assets/img/social-card.png # string, local or CORS resources

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  # Display "Edit this post" action on each post page to encourage contributions.
  edit_post:
    enabled: false

comments:
  # GitHub Discussions via giscus (free on public repos).
  provider: giscus
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  # Giscus options › https://giscus.app
  giscus:
    repo: tisan-das/tisan-das.github.io
    repo_id: R_kgDOId0yPg
    category: Announcements
    category_id: DIC_kwDOId0yPs4DCBB-
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: en
    reactions_enabled: 1

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    env: # [development | production]

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache
    deny_paths:

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  input: GFM # preserve GitHub-flavored markdown behavior from the old site
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # Keep '/:title/' so all existing post URLs stay unchanged after migration.
      permalink: /:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
