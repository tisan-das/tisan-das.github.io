<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 680" width="840" height="680" role="img" aria-labelledby="92-one-certificate-end-to-end-title 92-one-certificate-end-to-end-desc" font-family="Inter, &#x27;Segoe UI&#x27;, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><title id="92-one-certificate-end-to-end-title">The life of one workload certificate, end to end</title><desc id="92-one-certificate-end-to-end-desc">Three lifelines: the workload (app plus proxy or agent), the CA (with platform identity behind it) and a peer. 1: make a key pair. 2: write and self-sign a CSR. 3: send CSR plus identity evidence; the CA checks it. 4: the CA applies policy and signs. 5: the certificate returns and is loaded into the proxy. 6: the mTLS handshake. 7: the peer checks chain, key and policy. 8: renew at about half-life with a new key. 9: the certificate expires, or is revoked early.</desc><style>.bg{fill:#FFFFFF;stroke:#E3E1D9}
