0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse" style="overflow:visible"><path class="f-green" d="M0 0.8 L9.5 5 L0 9.2 Z" transform="scale(1.15) translate(-1.5 -0.65)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse" style="overflow:visible"><path class="f-amber" d="M0 0.8 L9.5 5 L0 9.2 Z" transform="scale(1.15) translate(-1.5 -0.65)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse" style="overflow:visible"><path class="f-red" d="M0 0.8 L9.5 5 L0 9.2 Z" transform="scale(1.15) translate(-1.5 -0.65)"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="839" height="524" rx="14" stroke-width="1"/><text class="hd" x="24.0" y="30.0" text-anchor="start" dominant-baseline="central">Two kinds of keys</text>
<g class="k-amber"><rect x="24.0" y="56.0" width="384.0" height="435.0" rx="12" stroke-width="1" stroke-dasharray="6 5" style="fill-opacity:0.45"/><text class="th" x="38.0" y="74.0" dominant-baseline="central">Symmetric key</text><text class="ts" x="38.0" y="93.0" dominant-baseline="central">One secret shared by both ends</text></g>
<g class="k-purple"><rect x="432.0" y="56.0" width="384.0" height="435.0" rx="12" stroke-width="1" stroke-dasharray="6 5" style="fill-opacity:0.45"/><text class="th" x="446.0" y="74.0" dominant-baseline="central">Asymmetric key pair</text><text class="ts" x="446.0" y="93.0" dominant-baseline="central">Two related keys with different jobs</text></g>
<g class="k-amber"><rect x="48.0" y="134.0" width="150.0" height="56.0" rx="8" stroke-width="1"/><text class="th" x="123.0" y="153.5" text-anchor="middle" dominant-baseline="central">Alice</text><text class="ts" x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central">holds key K</text></g>
<g class="k-amber"><rect x="234.0" y="134.0" width="150.0" height="56.0" rx="8" stroke-width="1"/><text class="th" x="309.0" y="153.5" text-anchor="middle" dominant-baseline="central">Bob</text><text class="ts" x="309.0" y="172.0" text-anchor="middle" dominant-baseline="central">holds key K</text></g>
<path class="ln" d="M 198.0 162.0 L 234.0 162.0" stroke-width="1.4" marker-end="url(#m-ln)" marker-start="url(#m-ln)" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="plate" x="182.9" y="111.0" width="66.3" height="18" rx="3"/>
<text class="ts" x="216.0" y="120.0" text-anchor="middle" dominant-baseline="central">same key</text>
<g>
<text class="t" x="60.0" y="231.5" dominant-baseline="central">Encrypt with K, decrypt with K.</text>
<text class="t" x="60.0" y="250.5" dominant-baseline="central">Very fast: AES does about 2 GB/s</text>
<text class="t" x="60.0" y="269.5" dominant-baseline="central">on a single CPU core.</text>
<text class="t" x="60.0" y="307.5" dominant-baseline="central">Problem: how do you give K to a</text>
<text class="t" x="60.0" y="326.5" dominant-baseline="central">stranger without someone copying it?</text>
</g>
<g class="k-gray"><rect x="48.0" y="385.0" width="336.0" height="70.0" rx="8" stroke-width="1"/><text class="th" x="216.0" y="411.5" text-anchor="middle" dominant-baseline="central">Used for: the bulk data</text><text class="ts" x="216.0" y="430.0" text-anchor="middle" dominant-baseline="central">after the handshake agrees on K</text></g>
<g class="k-purple"><rect x="456.0" y="130.0" width="160.0" height="64.0" rx="8" stroke-width="1"/><text class="th" x="536.0" y="153.5" text-anchor="middle" dominant-baseline="central">Private key d</text><text class="ts" x="536.0" y="172.0" text-anchor="middle" dominant-baseline="central">secret, never leaves</text></g>
<g class="k-teal"><rect x="636.0" y="130.0" width="160.0" height="64.0" rx="8" stroke-width="1"/><text class="th" x="716.0" y="153.5" text-anchor="middle" dominant-baseline="central">Public key Q</text><text class="ts" x="716.0" y="172.0" text-anchor="middle" dominant-baseline="central">give it to anyone</text></g>
<path class="ln" d="M 616.0 162.0 L 636.0 162.0" stroke-width="1.4" marker-end="url(#m-ln)" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="plate" x="598.0" y="109.0" width="55.9" height="18" rx="3"/>
<text class="ts" x="626.0" y="118.0" text-anchor="middle" dominant-baseline="central">Q = f(d)</text>
<g>
<text class="t" x="468.0" y="231.5" dominant-baseline="central">Computing Q from d is easy.</text>
<text class="t" x="468.0" y="250.5" dominant-baseline="central">Computing d from Q is infeasible</text>
<text class="t" x="468.0" y="269.5" dominant-baseline="central">today (a large future quantum</text>
<text class="t" x="468.0" y="288.5" dominant-baseline="central">computer could break it).</text>
<text class="t" x="468.0" y="307.5" dominant-baseline="central">Slow: hundreds to thousands of</text>
<text class="t" x="468.0" y="326.5" dominant-baseline="central">times slower than K for the same data.</text>
<text class="t" x="468.0" y="345.5" dominant-baseline="central">Sign with d, anyone verifies with Q.</text>
<text class="t" x="468.0" y="364.5" dominant-baseline="central">Mix a private key with their public key.</text>
</g>
<g class="k-gray"><rect x="456.0" y="385.0" width="340.0" height="70.0" rx="8" stroke-width="1"/><text class="th" x="626.0" y="411.5" text-anchor="middle" dominant-baseline="central">Used for: identity and agreeing on K</text><text class="ts" x="626.0" y="430.0" text-anchor="middle" dominant-baseline="central">signatures and key exchange</text></g></svg>