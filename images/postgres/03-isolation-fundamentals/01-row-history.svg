<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="t d"><title id="t">A row's linear version history: readers pick any version, writers append after the latest version</title><desc id="d">Row F12 has versions 6, 7 and 8 in a chain, with version 8 as the latest version. A reader with an older snapshot picks version 7; a reader with a newer snapshot picks version 8. A writer, at any isolation level, can only append a new version after the latest version.</desc><style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}.tt{font-size:14px;font-weight:600}.st{font-size:12px;font-weight:400}.bg{fill:#FFFFFF}.ln{stroke:#5F5E5A}.ah{stroke:#5F5E5A}.cap{fill:#5F5E5A}.ph{stroke:#888780}.r-gray{fill:#F1EFE8;stroke:#888780}.t-gray{fill:#2C2C2A}.s-gray{fill:#5F5E5A}.r-purple{fill:#EEEDFE;stroke:#534AB7}.t-purple{fill:#3C3489}.s-purple{fill:#534AB7}.r-coral{fill:#FAECE7;stroke:#993C1D}.t-coral{fill:#712B13}.s-coral{fill:#993C1D}.r-teal{fill:#E1F5EE;stroke:#0F6E56}.t-teal{fill:#085041}.s-teal{fill:#0F6E56}@media (prefers-color-scheme: dark){.bg{fill:#1E1E1C}.ln{stroke:#B4B2A9}.ah{stroke:#B4B2A9}.cap{fill:#B4B2A9}.ph{stroke:#888780}.r-gray{fill:#2C2C2A;stroke:#888780}.t-gray{fill:#F1EFE8}.s-gray{fill:#B4B2A9}.r-purple{fill:#26215C;stroke:#AFA9EC}.t-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.r-coral{fill:#4A1B0C;stroke:#F0997B}.t-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.r-teal{fill:#04342C;stroke:#5DCAA5}.t-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" width="680" height="340" rx="12" fill="#FFFFFF"/><rect x="60" y="30" width="210" height="56" rx="8" class="r-purple" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="165.0" y="55" text-anchor="middle" class="tt t-purple" fill="#3C3489" font-size="14" font-weight="600">Reader, older snapshot</text><text x="165.0" y="72" text-anchor="middle" class="st s-purple" fill="#534AB7" font-size="12" font-weight="400">picks version 7</text><rect x="300" y="30" width="210" height="56" rx="8" class="r-purple" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="405.0" y="55" text-anchor="middle" class="tt t-purple" fill="#3C3489" font-size="14" font-weight="600">Reader, newer snapshot</text><text x="405.0" y="72" text-anchor="middle" class="st s-purple" fill="#534AB7" font-size="12" font-weight="400">picks version 8</text><path d="M165 86 L165 106 L235 106 L235 128" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M405 86 L405 106 L375 106 L375 128" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="130" width="110" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="95.0" y="155" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Version 6</text><text x="95.0" y="172" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">superseded</text><rect x="180" y="130" width="110" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="235.0" y="155" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Version 7</text><text x="235.0" y="172" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">superseded</text><rect x="320" y="130" width="110" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="2"/><text x="375.0" y="155" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Version 8</text><text x="375.0" y="172" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">latest version</text><rect x="460" y="130" width="110" height="56" rx="8" class="ph" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text x="515.0" y="155" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Next</text><text x="515.0" y="172" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">only spot open</text><path d="M152 158 L178 158" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M292 158 L318 158" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M432 158 L458 158" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M515 230 L515 190" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="400" y="232" width="230" height="56" rx="8" class="r-coral" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="515.0" y="257" text-anchor="middle" class="tt t-coral" fill="#712B13" font-size="14" font-weight="600">Writer (any level)</text><text x="515.0" y="274" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">appends after the latest version</text><text x="340" y="322" text-anchor="middle" class="st cap" fill="#5F5E5A" font-size="12">Readers can use any version in the history. Writers can only add after the latest one.</text></svg>
