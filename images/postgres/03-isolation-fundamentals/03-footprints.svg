<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" aria-labelledby="t d"><title id="t">Writes leave a footprint in the row; reads leave none</title><desc id="d">When T1 writes F12, its transaction ID is set in the tuple's xmax, so any later writer finds it and every isolation level detects the conflict. When T1 reads F12, the tuple is unchanged, so later writers cannot know; only SERIALIZABLE tracks reads separately, with SIRead (predicate) locks.</desc><style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}.tt{font-size:14px;font-weight:600}.st{font-size:12px;font-weight:400}.bg{fill:#FFFFFF}.ln{stroke:#5F5E5A}.ah{stroke:#5F5E5A}.cap{fill:#5F5E5A}.ph{stroke:#888780}.r-gray{fill:#F1EFE8;stroke:#888780}.t-gray{fill:#2C2C2A}.s-gray{fill:#5F5E5A}.r-purple{fill:#EEEDFE;stroke:#534AB7}.t-purple{fill:#3C3489}.s-purple{fill:#534AB7}.r-coral{fill:#FAECE7;stroke:#993C1D}.t-coral{fill:#712B13}.s-coral{fill:#993C1D}.r-teal{fill:#E1F5EE;stroke:#0F6E56}.t-teal{fill:#085041}.s-teal{fill:#0F6E56}@media (prefers-color-scheme: dark){.bg{fill:#1E1E1C}.ln{stroke:#B4B2A9}.ah{stroke:#B4B2A9}.cap{fill:#B4B2A9}.ph{stroke:#888780}.r-gray{fill:#2C2C2A;stroke:#888780}.t-gray{fill:#F1EFE8}.s-gray{fill:#B4B2A9}.r-purple{fill:#26215C;stroke:#AFA9EC}.t-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.r-coral{fill:#4A1B0C;stroke:#F0997B}.t-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.r-teal{fill:#04342C;stroke:#5DCAA5}.t-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" width="680" height="310" rx="12" fill="#FFFFFF"/><rect x="60" y="20" width="250" height="44" rx="8" class="r-coral" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="185.0" y="47.0" text-anchor="middle" class="tt t-coral" fill="#712B13" font-size="14" font-weight="600">T1 writes F12</text><rect x="370" y="20" width="250" height="44" rx="8" class="r-purple" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="495.0" y="47.0" text-anchor="middle" class="tt t-purple" fill="#3C3489" font-size="14" font-weight="600">T1 reads F12</text><path d="M185 64 L185 98" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M495 64 L495 98" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="100" width="250" height="76" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="185.0" y="125" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Tuple F12</text><text x="185.0" y="146" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">xmax = T1's transaction ID</text><text x="185.0" y="164" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">later writers find it</text><rect x="370" y="100" width="250" height="76" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="495.0" y="125" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Tuple F12</text><text x="495.0" y="146" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">unchanged, no trace</text><text x="495.0" y="164" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">later writers can't know</text><path d="M185 176 L185 208" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M495 176 L495 208" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="210" width="250" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="185.0" y="235" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Every level notices</text><text x="185.0" y="252" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">T1's ID is in the row's xmax</text><rect x="370" y="210" width="250" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="495.0" y="235" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Only SERIALIZABLE notices</text><text x="495.0" y="252" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">tracks reads with SIRead locks</text><text x="340" y="296" text-anchor="middle" class="st cap" fill="#5F5E5A" font-size="12">Postgres can only react to a conflict that leaves a trace somewhere.</text></svg>
