<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="t d"><title id="t">The write-write dilemma and how each isolation promise resolves it</title><desc id="d">Storage requires T2 to write on top of version 8, but T2's snapshot only shows version 7. READ COMMITTED's per-statement promise allows using version 8, so it re-checks the WHERE clause and continues. REPEATABLE READ's one-snapshot promise and SERIALIZABLE's as-if-serial promise forbid it, so they abort with error 40001. Waiting cannot help because their snapshot never moves.</desc><style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}.tt{font-size:14px;font-weight:600}.st{font-size:12px;font-weight:400}.bg{fill:#FFFFFF}.ln{stroke:#5F5E5A}.ah{stroke:#5F5E5A}.cap{fill:#5F5E5A}.ph{stroke:#888780}.r-gray{fill:#F1EFE8;stroke:#888780}.t-gray{fill:#2C2C2A}.s-gray{fill:#5F5E5A}.r-purple{fill:#EEEDFE;stroke:#534AB7}.t-purple{fill:#3C3489}.s-purple{fill:#534AB7}.r-coral{fill:#FAECE7;stroke:#993C1D}.t-coral{fill:#712B13}.s-coral{fill:#993C1D}.r-teal{fill:#E1F5EE;stroke:#0F6E56}.t-teal{fill:#085041}.s-teal{fill:#0F6E56}@media (prefers-color-scheme: dark){.bg{fill:#1E1E1C}.ln{stroke:#B4B2A9}.ah{stroke:#B4B2A9}.cap{fill:#B4B2A9}.ph{stroke:#888780}.r-gray{fill:#2C2C2A;stroke:#888780}.t-gray{fill:#F1EFE8}.s-gray{fill:#B4B2A9}.r-purple{fill:#26215C;stroke:#AFA9EC}.t-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.r-coral{fill:#4A1B0C;stroke:#F0997B}.t-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.r-teal{fill:#04342C;stroke:#5DCAA5}.t-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" width="680" height="350" rx="12" fill="#FFFFFF"/><rect x="40" y="20" width="290" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="185.0" y="45" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Storage: latest version is v8</text><text x="185.0" y="62" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">committed by T1; T2 must write after it</text><rect x="350" y="20" width="290" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="495.0" y="45" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Snapshot: T2 sees only v7</text><text x="495.0" y="62" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">v8 is in T2's future</text><path d="M185 76 L185 93 L300 93 L300 108" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M495 76 L495 93 L380 93 L380 108" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="170" y="110" width="340" height="56" rx="8" class="r-gray" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="340.0" y="135" text-anchor="middle" class="tt t-gray" fill="#2C2C2A" font-size="14" font-weight="600">Conflict: v8 is not in T2's snapshot</text><text x="340.0" y="152" text-anchor="middle" class="st s-gray" fill="#5F5E5A" font-size="12" font-weight="400">does the level's promise allow using v8?</text><line x1="340" y1="166" x2="340" y2="186" class="ln" stroke="#5F5E5A" stroke-width="1.5"/><line x1="130" y1="186" x2="550" y2="186" class="ln" stroke="#5F5E5A" stroke-width="1.5"/><path d="M130 186 L130 208" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M340 186 L340 208" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M550 186 L550 208" fill="none" class="ln" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="210" width="180" height="96" rx="8" class="r-teal" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="130.0" y="235" text-anchor="middle" class="tt t-teal" fill="#085041" font-size="14" font-weight="600">READ COMMITTED</text><text x="130.0" y="258" text-anchor="middle" class="st s-teal" fill="#0F6E56" font-size="12" font-weight="400">promise: per statement</text><text x="130.0" y="276" text-anchor="middle" class="st s-teal" fill="#0F6E56" font-size="12" font-weight="400">using v8 is allowed</text><text x="130.0" y="294" text-anchor="middle" class="st s-teal" fill="#0F6E56" font-size="12" font-weight="400">re-check WHERE, go on</text><rect x="250" y="210" width="180" height="96" rx="8" class="r-coral" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="340.0" y="235" text-anchor="middle" class="tt t-coral" fill="#712B13" font-size="14" font-weight="600">REPEATABLE READ</text><text x="340.0" y="258" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">promise: one snapshot</text><text x="340.0" y="276" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">using v8 would break it</text><text x="340.0" y="294" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">abort with 40001</text><rect x="460" y="210" width="180" height="96" rx="8" class="r-coral" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="550.0" y="235" text-anchor="middle" class="tt t-coral" fill="#712B13" font-size="14" font-weight="600">SERIALIZABLE</text><text x="550.0" y="258" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">promise: as if serial</text><text x="550.0" y="276" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">using v8 would break it</text><text x="550.0" y="294" text-anchor="middle" class="st s-coral" fill="#993C1D" font-size="12" font-weight="400">abort with 40001</text><text x="340" y="334" text-anchor="middle" class="st cap" fill="#5F5E5A" font-size="12">Waiting longer can't help RR or SER: their snapshot never moves.</text></svg>
